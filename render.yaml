services:
  - type: web
    name: depanno-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: apps/backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /admin/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_DB
        value: plateforme_auto
      - key: MONGODB_URI
        sync: false
      - key: AUDIT_HMAC_KEY
        sync: false
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: PRO_ORIGIN
        sync: false
      - key: ADMIN_ORIGIN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
