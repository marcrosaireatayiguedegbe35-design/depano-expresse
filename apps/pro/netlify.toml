# Déploiement Netlify (base directory : ce dossier). Le module Next.js de Netlify est détecté automatiquement.
[build]
  command = "npm run build"
  publish = ".next"
  # Ne reconstruire ce site que si son dossier a changé depuis le dernier déploiement.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
